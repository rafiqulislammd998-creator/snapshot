<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="SnapNote - Your modern digital notebook with visual snapshots">
    <meta name="theme-color" content="#0a0a0a">
    <title>SnapNote - Visual Digital Notebook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap');
        
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #151515;
            --bg-tertiary: #1f1f1f;
            --accent: #00ff88;
            --accent-dim: #00ff8833;
            --accent-hover: #00dd77;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border: #2a2a2a;
            --error: #ff4444;
            --warning: #ffaa00;
            --success: #00ff88;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(21, 21, 21, 0.95);
            border-bottom: 1px solid var(--border);
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        
        .logo {
            font-family: 'Syne', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), #00ddff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }
        
        .header-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        
        .sync-status {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.375rem;
            margin-right: 0.5rem;
        }
        
        .sync-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .icon-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.2rem;
            user-select: none;
        }
        
        .icon-btn:hover {
            background: var(--bg-primary);
            border-color: var(--accent);
        }
        
        .icon-btn:active {
            transform: scale(0.95);
        }
        
        .icon-btn.primary {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
            font-weight: 600;
        }
        
        .icon-btn.primary:hover {
            background: var(--accent-hover);
        }
        
        /* Search Bar */
        .search-container {
            padding: 1rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
        }
        
        .search-box {
            position: relative;
        }
        
        .search-input {
            width: 100%;
            padding: 0.875rem 3rem 0.875rem 2.75rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        .search-input::placeholder {
            color: var(--text-secondary);
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }
        
        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
            font-size: 1.1rem;
        }
        
        .clear-search {
            position: absolute;
            right: 0.875rem;
            top: 50%;
            transform: translateY(-50%);
            background: var(--bg-secondary);
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.2rem;
            display: none;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .clear-search:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        
        .clear-search.show {
            display: flex;
        }
        
        /* Filter Tabs */
        .filter-tabs {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding: 0.875rem 1rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        
        .filter-tabs::-webkit-scrollbar {
            display: none;
        }
        
        .filter-tab {
            padding: 0.625rem 1.125rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        
        .filter-tab:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }
        
        .filter-tab.active {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }
        
        /* Notes Grid */
        .notes-container {
            padding: 1rem;
            min-height: calc(100vh - 280px);
        }
        
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
            animation: fadeIn 0.4s ease-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .note-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.125rem;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        
        .note-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent);
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .note-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 255, 136, 0.1);
        }
        
        .note-card:hover::before {
            opacity: 1;
        }
        
        .note-card:active {
            transform: scale(0.98);
        }
        
        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.875rem;
        }
        
        .note-title {
            font-weight: 600;
            font-size: 1.1rem;
            line-height: 1.4;
            color: var(--text-primary);
            flex: 1;
            margin-right: 0.5rem;
        }
        
        .note-content {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.7;
            margin-bottom: 0.875rem;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .note-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.875rem;
            padding-top: 0.875rem;
            border-top: 1px solid var(--border);
        }
        
        .note-tags {
            display: flex;
            gap: 0.375rem;
            flex-wrap: wrap;
            flex: 1;
        }
        
        .tag {
            padding: 0.3rem 0.75rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 14px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .note-date {
            font-size: 0.75rem;
            color: var(--text-secondary);
            white-space: nowrap;
            margin-left: 0.5rem;
        }
        
        .note-thumbnail {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 0.875rem;
            border: 1px solid var(--border);
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-secondary);
        }
        
        .empty-icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            opacity: 0.2;
            filter: grayscale(1);
        }
        
        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }
        
        .empty-state p {
            font-size: 0.95rem;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 1000;
            animation: fadeIn 0.2s;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: var(--bg-secondary);
            z-index: 10;
        }
        
        .modal-title {
            font-weight: 600;
            font-size: 1.35rem;
            color: var(--text-primary);
        }
        
        .modal-close {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.375rem;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .modal-close:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
            border-color: var(--accent);
        }
        
        .modal-body {
            padding: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.625rem;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        
        .form-input {
            width: 100%;
            padding: 0.875rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s;
        }
        
        .form-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }
        
        textarea.form-input {
            min-height: 180px;
            resize: vertical;
            line-height: 1.7;
        }
        
        .tag-input-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 0.75rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 10px;
            min-height: 48px;
            transition: all 0.2s;
        }
        
        .tag-input-container:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }
        
        .tag-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.75rem;
            background: var(--accent);
            color: var(--bg-primary);
            border-radius: 14px;
            font-size: 0.875rem;
            font-weight: 500;
            animation: popIn 0.2s ease-out;
        }
        
        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .tag-remove {
            background: rgba(0, 0, 0, 0.2);
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 1rem;
            padding: 0;
            line-height: 1;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .tag-remove:hover {
            background: rgba(0, 0, 0, 0.4);
        }
        
        .tag-input {
            flex: 1;
            min-width: 140px;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            font-family: inherit;
        }
        
        .snapshot-preview {
            margin-top: 1rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .snapshot-preview img {
            width: 100%;
            display: block;
        }
        
        .modal-footer {
            padding: 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 0.875rem;
            position: sticky;
            bottom: 0;
            background: var(--bg-secondary);
        }
        
        .btn {
            flex: 1;
            padding: 0.875rem 1.25rem;
            border-radius: 10px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-family: inherit;
            user-select: none;
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .btn-primary {
            background: var(--accent);
            color: var(--bg-primary);
        }
        
        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 12px rgba(0, 255, 136, 0.3);
        }
        
        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            background: var(--bg-primary);
            border-color: var(--accent);
        }
        
        .btn-danger {
            background: var(--error);
            color: white;
        }
        
        .btn-danger:hover {
            background: #dd3333;
        }
        
        /* Snapshot Canvas */
        #snapshotCanvas {
            position: fixed;
            top: -10000px;
            left: -10000px;
        }
        
        /* Stats */
        .stats-bar {
            padding: 0.875rem 1rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        
        .stats-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .stats-item strong {
            color: var(--accent);
            font-weight: 600;
        }
        
        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 1rem 1.75rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s ease-out;
            font-weight: 500;
        }
        
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        
        .toast.success {
            border-color: var(--accent);
        }
        
        .toast.error {
            border-color: var(--error);
        }
        
        /* Loading Spinner */
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .notes-grid {
                grid-template-columns: 1fr;
            }
            
            .modal-content {
                width: 96%;
                max-height: 94vh;
                border-radius: 14px;
            }
            
            .logo {
                font-size: 1.35rem;
            }
            
            .sync-status {
                display: none;
            }
        }
        
        @media (max-width: 480px) {
            .header {
                padding: 0.875rem;
            }
            
            .search-container {
                padding: 0.875rem;
            }
            
            .notes-container {
                padding: 0.875rem;
            }
            
            .modal-header,
            .modal-body,
            .modal-footer {
                padding: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">SnapNote</div>
        <div class="header-actions">
            <div class="sync-status" id="syncStatus">
                <div class="sync-indicator"></div>
                <span>Synced</span>
            </div>
            <button class="icon-btn" onclick="toggleView()" title="Change View" aria-label="Toggle view">
                <span id="viewIcon">📊</span>
            </button>
            <button class="icon-btn primary" onclick="openNewNoteModal()" title="New Note" aria-label="Create new note">
                ➕
            </button>
        </div>
    </header>

    <!-- Search -->
    <div class="search-container">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input 
                type="text" 
                class="search-input" 
                id="searchInput" 
                placeholder="Search notes by title, content, or tags..."
                aria-label="Search notes"
            >
            <button class="clear-search" id="clearSearch" onclick="clearSearch()" aria-label="Clear search">✕</button>
        </div>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs" id="filterTabs" role="tablist">
        <button class="filter-tab active" data-filter="all" role="tab">All Notes</button>
        <button class="filter-tab" data-filter="recent" role="tab">Recent</button>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar">
        <div class="stats-item">
            <span>📝</span>
            <strong id="noteCount">0</strong>
            <span>Notes</span>
        </div>
        <div class="stats-item">
            <span>🏷️</span>
            <strong id="tagCount">0</strong>
            <span>Tags</span>
        </div>
    </div>

    <!-- Notes Container -->
    <div class="notes-container">
        <div class="notes-grid" id="notesGrid" role="list">
            <!-- Notes will be dynamically added here -->
        </div>
        <div class="empty-state" id="emptyState">
            <div class="empty-icon">📝</div>
            <h3>No Notes Yet</h3>
            <p>Create your first note to get started</p>
        </div>
    </div>

    <!-- Note Modal -->
    <div class="modal" id="noteModal" role="dialog" aria-labelledby="modalTitle" aria-modal="true">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">New Note</h3>
                <button class="modal-close" onclick="closeModal()" aria-label="Close modal">✕</button>
            </div>
            <div class="modal-body">
                <form id="noteForm" onsubmit="saveNote(event)">
                    <div class="form-group">
                        <label class="form-label" for="noteTitle">Title</label>
                        <input 
                            type="text" 
                            class="form-input" 
                            id="noteTitle" 
                            required 
                            placeholder="Enter note title..."
                            maxlength="100"
                        >
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="noteContent">Content</label>
                        <textarea 
                            class="form-input" 
                            id="noteContent" 
                            required 
                            placeholder="Write your note here..."
                        ></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="tagInput">Tags (Press Enter)</label>
                        <div class="tag-input-container" id="tagContainer">
                            <input 
                                type="text" 
                                class="tag-input" 
                                id="tagInput" 
                                placeholder="Add tags..."
                                maxlength="20"
                            >
                        </div>
                    </div>
                    <div class="form-group">
                        <button type="button" class="btn btn-secondary" onclick="captureSnapshot()">
                            📸 Capture Snapshot
                        </button>
                        <div id="snapshotPreview" class="snapshot-preview" style="display: none;"></div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveNote(event)">Save Note</button>
            </div>
        </div>
    </div>

    <!-- View Note Modal -->
    <div class="modal" id="viewNoteModal" role="dialog" aria-labelledby="viewNoteTitle" aria-modal="true">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="viewNoteTitle"></h3>
                <button class="modal-close" onclick="closeViewModal()" aria-label="Close modal">✕</button>
            </div>
            <div class="modal-body">
                <div id="viewNoteSnapshot" style="display: none; margin-bottom: 1.5rem;">
                    <img style="width: 100%; border-radius: 10px; border: 1px solid var(--border);" alt="Note snapshot">
                </div>
                <div id="viewNoteContent" style="line-height: 1.8; color: var(--text-primary); white-space: pre-wrap;"></div>
                <div id="viewNoteTags" style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1.5rem;"></div>
                <div id="viewNoteDate" style="margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-secondary);"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" onclick="deleteCurrentNote()">Delete</button>
                <button class="btn btn-secondary" onclick="editCurrentNote()">Edit</button>
                <button class="btn btn-primary" onclick="downloadNoteImage()">Download</button>
            </div>
        </div>
    </div>

    <!-- Hidden Canvas for Snapshot -->
    <canvas id="snapshotCanvas"></canvas>

    <!-- Toast -->
    <div class="toast" id="toast" role="alert" aria-live="polite"></div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, getDocs, query, orderBy, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBvE82yFAhJbGTuj_l-wGvI8aBh-2B7O_0",
            authDomain: "aesthetics-academy.firebaseapp.com",
            projectId: "aesthetics-academy",
            storageBucket: "aesthetics-academy.firebasestorage.app",
            messagingSenderId: "229742131602",
            appId: "1:229742131602:web:89ebc8ad85442e7d83294b",
            measurementId: "G-NZTP202VJM"
        };

        // Initialize Firebase
        let app, db;
        let useFirebase = false;

        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            useFirebase = true;
            console.log('Firebase initialized successfully');
            updateSyncStatus('Synced');
        } catch (error) {
            console.warn('Firebase not configured, using localStorage only:', error);
            useFirebase = false;
            updateSyncStatus('Local Only');
        }

        // Make Firebase available globally
        window.firebaseDB = db;
        window.useFirebase = useFirebase;
        window.firestoreModules = { collection, addDoc, updateDoc, deleteDoc, doc, getDocs, query, orderBy, onSnapshot };

        // Load notes on startup
        if (useFirebase) {
            loadNotesFromFirebase();
            setupRealtimeSync();
        } else {
            window.loadNotes();
        }
    </script>

    <script>
        // State Management
        let notes = [];
        let currentNoteId = null;
        let currentTags = [];
        let currentSnapshot = null;
        let allTags = new Set();
        let currentFilter = 'all';
        let currentView = 'grid';
        let unsubscribeSnapshot = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            if (!window.useFirebase) {
                loadNotes();
            }
            setupEventListeners();
            renderNotes();
            updateStats();
        });

        function setupEventListeners() {
            // Search
            document.getElementById('searchInput').addEventListener('input', handleSearch);
            
            // Tag input
            const tagInput = document.getElementById('tagInput');
            if (tagInput) {
                tagInput.addEventListener('keydown', handleTagInput);
            }
            
            // Filter tabs
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    renderNotes();
                });
            });

            // Close modals on outside click
            document.getElementById('noteModal').addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });
            document.getElementById('viewNoteModal').addEventListener('click', function(e) {
                if (e.target === this) closeViewModal();
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeModal();
                    closeViewModal();
                }
            });
        }

        // Firebase Functions
        async function loadNotesFromFirebase() {
            try {
                updateSyncStatus('Loading...');
                const { collection, getDocs, query, orderBy } = window.firestoreModules;
                const q = query(collection(window.firebaseDB, 'notes'), orderBy('createdAt', 'desc'));
                const querySnapshot = await getDocs(q);
                
                notes = [];
                allTags.clear();
                
                querySnapshot.forEach((doc) => {
                    const note = { firebaseId: doc.id, ...doc.data() };
                    notes.push(note);
                    if (note.tags) {
                        note.tags.forEach(tag => allTags.add(tag));
                    }
                });
                
                updateFilterTabs();
                renderNotes();
                updateStats();
                updateSyncStatus('Synced');
            } catch (error) {
                console.error('Error loading notes:', error);
                showToast('Error loading notes', 'error');
                updateSyncStatus('Error');
            }
        }

        function setupRealtimeSync() {
            const { collection, query, orderBy, onSnapshot } = window.firestoreModules;
            const q = query(collection(window.firebaseDB, 'notes'), orderBy('createdAt', 'desc'));
            
            unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === 'added' || change.type === 'modified') {
                        const note = { firebaseId: change.doc.id, ...change.doc.data() };
                        const index = notes.findIndex(n => n.firebaseId === note.firebaseId);
                        
                        if (index !== -1) {
                            notes[index] = note;
                        } else {
                            notes.push(note);
                        }
                        
                        if (note.tags) {
                            note.tags.forEach(tag => allTags.add(tag));
                        }
                    } else if (change.type === 'removed') {
                        notes = notes.filter(n => n.firebaseId !== change.doc.id);
                    }
                });
                
                notes.sort((a, b) => b.createdAt - a.createdAt);
                updateFilterTabs();
                renderNotes();
                updateStats();
            });
        }

        function updateSyncStatus(status) {
            const syncStatus = document.getElementById('syncStatus');
            if (syncStatus) {
                syncStatus.querySelector('span').textContent = status;
            }
        }

        // Storage Functions (localStorage fallback)
        function loadNotes() {
            const stored = localStorage.getItem('snapnotes');
            if (stored) {
                notes = JSON.parse(stored);
                notes.forEach(note => {
                    if (note.tags) {
                        note.tags.forEach(tag => allTags.add(tag));
                    }
                });
                updateFilterTabs();
            }
        }

        function saveNotesLocal() {
            localStorage.setItem('snapnotes', JSON.stringify(notes));
        }

        // Modal Functions
        function openNewNoteModal() {
            currentNoteId = null;
            currentTags = [];
            currentSnapshot = null;
            document.getElementById('modalTitle').textContent = 'New Note';
            document.getElementById('noteForm').reset();
            document.getElementById('tagContainer').innerHTML = '<input type="text" class="tag-input" id="tagInput" placeholder="Add tags..." maxlength="20">';
            document.getElementById('snapshotPreview').style.display = 'none';
            document.getElementById('noteModal').classList.add('show');
            setupEventListeners();
            document.getElementById('noteTitle').focus();
        }

        function closeModal() {
            document.getElementById('noteModal').classList.remove('show');
        }

        function closeViewModal() {
            document.getElementById('viewNoteModal').classList.remove('show');
        }

        // Tag Management
        function handleTagInput(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const input = e.target;
                const value = input.value.trim();
                if (value && !currentTags.includes(value)) {
                    currentTags.push(value);
                    renderTagInput();
                    input.value = '';
                }
            }
        }

        function removeTag(tag) {
            currentTags = currentTags.filter(t => t !== tag);
            renderTagInput();
        }

        function renderTagInput() {
            const container = document.getElementById('tagContainer');
            container.innerHTML = currentTags.map(tag => 
                `<div class="tag-item">
                    <span>${escapeHtml(tag)}</span>
                    <button type="button" class="tag-remove" onclick="removeTag('${escapeHtml(tag)}')" aria-label="Remove tag">✕</button>
                </div>`
            ).join('') + '<input type="text" class="tag-input" id="tagInput" placeholder="Add tags..." maxlength="20">';
            
            const newInput = document.getElementById('tagInput');
            if (newInput) {
                newInput.addEventListener('keydown', handleTagInput);
                newInput.focus();
            }
        }

        // Snapshot Functions
        function captureSnapshot() {
            const title = document.getElementById('noteTitle').value;
            const content = document.getElementById('noteContent').value;
            
            if (!title || !content) {
                showToast('Title and content required', 'error');
                return;
            }

            const canvas = document.getElementById('snapshotCanvas');
            const ctx = canvas.getContext('2d');
            
            // Set canvas size
            canvas.width = 1200;
            canvas.height = 800;
            
            // Background
            ctx.fillStyle = '#151515';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Accent bar
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#00ff88');
            gradient.addColorStop(1, '#00ddff');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 12, canvas.height);
            
            // Title
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 48px IBM Plex Sans, sans-serif';
            ctx.fillText(title.substring(0, 40), 60, 100);
            
            // Line under title
            ctx.fillStyle = '#2a2a2a';
            ctx.fillRect(60, 130, canvas.width - 120, 3);
            
            // Content
            ctx.fillStyle = '#a0a0a0';
            ctx.font = '24px IBM Plex Sans, sans-serif';
            
            const words = content.split(' ');
            let line = '';
            let y = 200;
            const maxWidth = canvas.width - 120;
            const lineHeight = 42;
            let lineCount = 0;
            const maxLines = 12;
            
            for (let word of words) {
                if (lineCount >= maxLines) {
                    ctx.fillText('...', 60, y);
                    break;
                }
                
                const testLine = line + word + ' ';
                const metrics = ctx.measureText(testLine);
                
                if (metrics.width > maxWidth && line !== '') {
                    ctx.fillText(line, 60, y);
                    line = word + ' ';
                    y += lineHeight;
                    lineCount++;
                } else {
                    line = testLine;
                }
            }
            if (lineCount < maxLines && line) {
                ctx.fillText(line, 60, y);
            }
            
            // Tags
            if (currentTags.length > 0) {
                y = canvas.height - 100;
                ctx.font = '20px IBM Plex Sans, sans-serif';
                let x = 60;
                
                currentTags.slice(0, 5).forEach(tag => {
                    const tagWidth = ctx.measureText(tag).width + 40;
                    
                    // Tag background
                    ctx.fillStyle = '#1f1f1f';
                    ctx.fillRect(x, y - 28, tagWidth, 40);
                    
                    // Tag border
                    ctx.strokeStyle = '#2a2a2a';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x, y - 28, tagWidth, 40);
                    
                    // Tag text
                    ctx.fillStyle = '#00ff88';
                    ctx.fillText(tag, x + 20, y);
                    
                    x += tagWidth + 15;
                });
            }
            
            // Branding
            ctx.fillStyle = '#00ff88';
            ctx.font = 'bold 24px Syne, sans-serif';
            ctx.fillText('SnapNote', 60, canvas.height - 40);
            
            // Date
            ctx.fillStyle = '#666666';
            ctx.font = '18px IBM Plex Sans, sans-serif';
            const dateStr = new Date().toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
            ctx.fillText(dateStr, canvas.width - 60 - ctx.measureText(dateStr).width, canvas.height - 40);
            
            // Convert to image
            currentSnapshot = canvas.toDataURL('image/png', 0.95);
            
            // Show preview
            const preview = document.getElementById('snapshotPreview');
            preview.innerHTML = `<img src="${currentSnapshot}" alt="Note snapshot preview">`;
            preview.style.display = 'block';
            
            showToast('Snapshot captured successfully', 'success');
        }

        // Note CRUD
        async function saveNote(e) {
            if (e) e.preventDefault();
            
            const title = document.getElementById('noteTitle').value.trim();
            const content = document.getElementById('noteContent').value.trim();
            
            if (!title || !content) {
                showToast('Title and content required', 'error');
                return;
            }
            
            const noteData = {
                title,
                content,
                tags: currentTags,
                snapshot: currentSnapshot,
                createdAt: currentNoteId ? 
                    (window.useFirebase ? 
                        notes.find(n => n.firebaseId === currentNoteId)?.createdAt : 
                        notes.find(n => n.id === currentNoteId)?.createdAt) || Date.now() 
                    : Date.now(),
                updatedAt: Date.now()
            };
            
            if (window.useFirebase) {
                try {
                    updateSyncStatus('Saving...');
                    if (currentNoteId) {
                        const { doc, updateDoc } = window.firestoreModules;
                        await updateDoc(doc(window.firebaseDB, 'notes', currentNoteId), noteData);
                        showToast('Note updated successfully', 'success');
                    } else {
                        const { collection, addDoc } = window.firestoreModules;
                        await addDoc(collection(window.firebaseDB, 'notes'), noteData);
                        showToast('Note saved successfully', 'success');
                    }
                    updateSyncStatus('Synced');
                } catch (error) {
                    console.error('Error saving note:', error);
                    showToast('Error saving note', 'error');
                    updateSyncStatus('Error');
                    return;
                }
            } else {
                const note = {
                    id: currentNoteId || Date.now(),
                    ...noteData
                };
                
                if (currentNoteId) {
                    const index = notes.findIndex(n => n.id === currentNoteId);
                    notes[index] = note;
                    showToast('Note updated', 'success');
                } else {
                    notes.unshift(note);
                    showToast('Note saved', 'success');
                }
                
                currentTags.forEach(tag => allTags.add(tag));
                saveNotesLocal();
                updateFilterTabs();
                renderNotes();
                updateStats();
            }
            
            closeModal();
        }

        function viewNote(id) {
            const note = window.useFirebase ? 
                notes.find(n => n.firebaseId === id) : 
                notes.find(n => n.id === id);
            
            if (!note) return;
            
            currentNoteId = window.useFirebase ? note.firebaseId : note.id;
            document.getElementById('viewNoteTitle').textContent = note.title;
            document.getElementById('viewNoteContent').textContent = note.content;
            
            if (note.snapshot) {
                const snapshotDiv = document.getElementById('viewNoteSnapshot');
                snapshotDiv.querySelector('img').src = note.snapshot;
                snapshotDiv.style.display = 'block';
            } else {
                document.getElementById('viewNoteSnapshot').style.display = 'none';
            }
            
            const tagsDiv = document.getElementById('viewNoteTags');
            tagsDiv.innerHTML = (note.tags || []).map(tag => 
                `<span class="tag">${escapeHtml(tag)}</span>`
            ).join('');
            
            const dateStr = new Date(note.createdAt).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            document.getElementById('viewNoteDate').textContent = 'Created: ' + dateStr;
            
            document.getElementById('viewNoteModal').classList.add('show');
        }

        function editCurrentNote() {
            const note = window.useFirebase ? 
                notes.find(n => n.firebaseId === currentNoteId) : 
                notes.find(n => n.id === currentNoteId);
            
            if (!note) return;
            
            closeViewModal();
            
            document.getElementById('modalTitle').textContent = 'Edit Note';
            document.getElementById('noteTitle').value = note.title;
            document.getElementById('noteContent').value = note.content;
            currentTags = [...(note.tags || [])];
            currentSnapshot = note.snapshot;
            
            renderTagInput();
            
            if (note.snapshot) {
                const preview = document.getElementById('snapshotPreview');
                preview.innerHTML = `<img src="${note.snapshot}" alt="Note snapshot preview">`;
                preview.style.display = 'block';
            }
            
            document.getElementById('noteModal').classList.add('show');
        }

        async function deleteCurrentNote() {
            if (!confirm('Are you sure you want to delete this note?')) return;
            
            if (window.useFirebase) {
                try {
                    updateSyncStatus('Deleting...');
                    const { doc, deleteDoc } = window.firestoreModules;
                    await deleteDoc(doc(window.firebaseDB, 'notes', currentNoteId));
                    showToast('Note deleted', 'success');
                    updateSyncStatus('Synced');
                } catch (error) {
                    console.error('Error deleting note:', error);
                    showToast('Error deleting note', 'error');
                    updateSyncStatus('Error');
                    return;
                }
            } else {
                notes = notes.filter(n => n.id !== currentNoteId);
                saveNotesLocal();
                renderNotes();
                updateStats();
                showToast('Note deleted', 'success');
            }
            
            closeViewModal();
        }

        function downloadNoteImage() {
            const note = window.useFirebase ? 
                notes.find(n => n.firebaseId === currentNoteId) : 
                notes.find(n => n.id === currentNoteId);
            
            if (!note || !note.snapshot) {
                showToast('No snapshot available', 'error');
                return;
            }
            
            const link = document.createElement('a');
            link.download = `${note.title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_snapshot.png`;
            link.href = note.snapshot;
            link.click();
            
            showToast('Download started', 'success');
        }

        // Render Functions
        function renderNotes() {
            let filteredNotes = [...notes];
            
            // Apply filter
            if (currentFilter !== 'all') {
                if (currentFilter === 'recent') {
                    const weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
                    filteredNotes = filteredNotes.filter(n => n.createdAt > weekAgo);
                } else {
                    filteredNotes = filteredNotes.filter(n => 
                        n.tags && n.tags.includes(currentFilter)
                    );
                }
            }
            
            // Apply search
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            if (searchTerm) {
                filteredNotes = filteredNotes.filter(n => 
                    n.title.toLowerCase().includes(searchTerm) ||
                    n.content.toLowerCase().includes(searchTerm) ||
                    (n.tags && n.tags.some(t => t.toLowerCase().includes(searchTerm)))
                );
            }
            
            const grid = document.getElementById('notesGrid');
            const emptyState = document.getElementById('emptyState');
            
            if (filteredNotes.length === 0) {
                grid.innerHTML = '';
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
                const noteId = window.useFirebase ? 'firebaseId' : 'id';
                grid.innerHTML = filteredNotes.map(note => `
                    <div class="note-card" onclick="viewNote('${note[noteId]}')" role="listitem">
                        ${note.snapshot ? `<img src="${note.snapshot}" class="note-thumbnail" alt="${escapeHtml(note.title)} thumbnail">` : ''}
                        <div class="note-header">
                            <div class="note-title">${escapeHtml(note.title)}</div>
                        </div>
                        <div class="note-content">${escapeHtml(note.content)}</div>
                        <div class="note-footer">
                            <div class="note-tags">
                                ${(note.tags || []).slice(0, 3).map(tag => 
                                    `<span class="tag">${escapeHtml(tag)}</span>`
                                ).join('')}
                            </div>
                            <div class="note-date">${formatDate(note.createdAt)}</div>
                        </div>
                    </div>
                `).join('');
            }
        }

        function updateFilterTabs() {
            const tabs = document.getElementById('filterTabs');
            const sortedTags = Array.from(allTags).sort();
            const tagTabs = sortedTags.map(tag => 
                `<button class="filter-tab" data-filter="${escapeHtml(tag)}" role="tab">${escapeHtml(tag)}</button>`
            ).join('');
            
            tabs.innerHTML = `
                <button class="filter-tab active" data-filter="all" role="tab">All Notes</button>
                <button class="filter-tab" data-filter="recent" role="tab">Recent</button>
                ${tagTabs}
            `;
            
            tabs.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    renderNotes();
                });
            });
        }

        function updateStats() {
            document.getElementById('noteCount').textContent = notes.length;
            document.getElementById('tagCount').textContent = allTags.size;
        }

        // Search
        function handleSearch(e) {
            const value = e.target.value;
            const clearBtn = document.getElementById('clearSearch');
            
            if (value) {
                clearBtn.classList.add('show');
            } else {
                clearBtn.classList.remove('show');
            }
            
            renderNotes();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('clearSearch').classList.remove('show');
            renderNotes();
        }

        // View Toggle
        function toggleView() {
            currentView = currentView === 'grid' ? 'list' : 'grid';
            document.getElementById('viewIcon').textContent = currentView === 'grid' ? '📊' : '📋';
            // Could implement different view layouts here
        }

        // Utilities
        function formatDate(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            if (days === 0) return 'Today';
            if (days === 1) return 'Yesterday';
            if (days < 7) return `${days} days ago`;
            if (days < 30) return `${Math.floor(days / 7)} weeks ago`;
            
            return date.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: date.getFullYear() !== now.getFullYear() ? 'numeric' : undefined
            });
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Make functions globally available
        window.loadNotes = loadNotes;
    </script>
</body>
